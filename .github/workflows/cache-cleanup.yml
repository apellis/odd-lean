name: cache-cleanup

# A closed pull request's build caches can no longer be restored by anything; delete them so
# they do not push the branch caches out of the 10 GB repository cache.
on:
  pull_request:
    types: [closed]

jobs:
  delete-caches:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Delete this pull request's caches
        env:
          GH_TOKEN: ${{ github.token }}
          REF: refs/pull/${{ github.event.pull_request.number }}/merge
        run: |
          gh cache list --repo "$GITHUB_REPOSITORY" --ref "$REF" --limit 100 --json id --jq '.[].id' |
            while read -r id; do
              gh cache delete --repo "$GITHUB_REPOSITORY" "$id" || true
            done

name: build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# A newer push to a pull request cancels its running build. Master builds always run to
# completion.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    # A cold build takes a few hours with the memory limits below; the build cache saved at the end
    # makes later runs incremental.
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # A change touching only Markdown files cannot affect the Lean build.
      - name: Detect documentation-only change
        id: scope
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          if files=$(git diff --name-only "$base" HEAD 2>/dev/null) && [ -n "$files" ] \
              && ! printf '%s\n' "$files" | grep -qvE '\.md$'; then
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
            echo "Only Markdown files changed; skipping the Lean build."
          else
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up Lean and fetch the Mathlib cache
        if: steps.scope.outputs.docs_only != 'true'
        uses: leanprover/lean-action@v1
        with:
          build: false
          test: false
          lint: false
          use-mathlib-cache: true
          use-github-cache: false
      # Only master builds write the cache (one entry per run); pull requests restore the newest
      # master entry, so their entries cannot evict master's from the repository's cache quota.
      # Restores fall back to the newest entry for the same toolchain and manifest, then to the
      # newest entry for the toolchain (oleans of modules unaffected by a dependency bump stay
      # valid; Lake rebuilds the rest).
      - name: Restore build cache
        if: steps.scope.outputs.docs_only != 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            .lake/build
            .lake/packages/DG/.lake/build
            .lake/packages/StringDiagrams/.lake/build
            .lake/packages/LieLean/.lake/build
          key: lake-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            lake-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-
            lake-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}-
      # Keep this dependency separate: changing the paths of the main cache invalidates
      # its cache version, including entries selected by restore-keys.
      - name: Restore Categorification cache
        if: steps.scope.outputs.docs_only != 'true'
        uses: actions/cache/restore@v4
        with:
          path: .lake/packages/Categorification/.lake/build
          key: categorification-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            categorification-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-
            categorification-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}-
      # The largest modules need up to about 6 GB and the runner has 16 GB: two concurrent Lean
      # processes.
      - name: Build
        if: steps.scope.outputs.docs_only != 'true'
        env:
          LEAN_NUM_THREADS: 2
        run: lake build --wfail < /dev/null
      - name: Axiom audit
        if: steps.scope.outputs.docs_only != 'true'
        run: lake env lean -DwarningAsError=true scripts/AxiomAudit.lean
      # The checks form the library `NonVacuity` (see `lakefile.lean`), so their `.olean` files are
      # cached with the build and only checks whose imports changed are elaborated again.
      - name: Non-vacuity checks
        if: steps.scope.outputs.docs_only != 'true'
        env:
          LEAN_NUM_THREADS: 2
        run: lake build --wfail NonVacuity < /dev/null
      - name: Save Categorification cache
        if: always() && github.event_name != 'pull_request' && steps.scope.outputs.docs_only != 'true'
        uses: actions/cache/save@v4
        with:
          path: .lake/packages/Categorification/.lake/build
          key: categorification-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Save build cache
        if: always() && github.event_name != 'pull_request' && steps.scope.outputs.docs_only != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            .lake/build
            .lake/packages/DG/.lake/build
            .lake/packages/StringDiagrams/.lake/build
            .lake/packages/LieLean/.lake/build
          key: lake-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-${{ github.run_id }}-${{ github.run_attempt }}

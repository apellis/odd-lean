name: build

on:
  push:
    branches: [master, research/odd-nondegeneracy]
  pull_request:
  workflow_dispatch:

# A newer push to a pull request cancels its running build. Branch builds always run to
# completion.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    # A cold build takes a few hours; Lean uses all four runner cores; the build cache saved at the end
    # makes later runs incremental.
    timeout-minutes: 340
    # Pull requests stop at the first Lean error instead of compiling the rest of the library:
    # the awk filter exits on the first error line, which ends Lake through the closed pipe.
    # Branch builds always run to completion.
    env:
      FAIL_FAST: '{ print } /^error: / { print "::error::First Lean error above; stopping this pull request build early."; exit 1 }'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # A change touching only Markdown files cannot affect the Lean build.
      - name: Detect documentation-only change
        id: scope
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          if files=$(git diff --name-only "$base" HEAD 2>/dev/null) && [ -n "$files" ] \
              && ! printf '%s\n' "$files" | grep -qvE '\.md$'; then
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
            echo "Only Markdown files changed; skipping the Lean build."
          else
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          fi
      # Leave room for both the Mathlib cache and the first cold build of our dependencies.
      # These preinstalled SDKs are unused by this Lean-only job.
      - name: Free runner space for Lean artifacts
        if: steps.scope.outputs.docs_only != 'true'
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h .
      - name: Set up Lean and fetch the Mathlib cache
        if: steps.scope.outputs.docs_only != 'true'
        uses: leanprover/lean-action@v1
        with:
          build: false
          test: false
          lint: false
          use-mathlib-cache: true
          use-github-cache: false
      # Branch builds write caches; pull requests save their own build cache too (scoped to the
      # pull request), so a later push to the same pull request recompiles only what changed. Exclude generated Lean
      # setup JSON before saving: Lake writes it before compilation, and import metadata can
      # otherwise consume many GB when restoring a cache. Retain proof artifacts and traces.
      # Restores fall back to the newest entry for the same toolchain and manifest, then to the
      # newest entry for the toolchain (oleans of modules unaffected by a dependency bump stay
      # valid; Lake rebuilds the rest).
      - name: Restore build cache
        if: steps.scope.outputs.docs_only != 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            .lake/build
            .lake/packages/DG/.lake/build
            .lake/packages/StringDiagrams/.lake/build
            .lake/packages/LieLean/.lake/build
          key: lake-artifacts-v2-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            lake-artifacts-v2-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-
            lake-artifacts-v2-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}-
            lake-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-
      # Keep this dependency separate: changing the paths of the main cache invalidates
      # its cache version, including entries selected by restore-keys.
      - name: Restore Categorification cache
        if: steps.scope.outputs.docs_only != 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            .lake/packages/Categorification/.lake/build
          key: categorification-artifacts-v2-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            categorification-artifacts-v2-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-
            categorification-artifacts-v2-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}-
            categorification-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-
      # Migrate an exact-toolchain/manifest legacy cache when v2 has not yet been seeded.
      # Runner space was freed before restoration; discard regenerated setup metadata
      # immediately, while keeping the compiled proof artifacts for the strict checks.
      - name: Remove restored Lean setup metadata
        if: steps.scope.outputs.docs_only != 'true'
        run: |
          for build in .lake/build .lake/packages/{DG,StringDiagrams,LieLean,Categorification}/.lake/build; do
            if [ -d "$build/ir" ]; then
              find "$build/ir" -type f -name '*.setup.json' -delete
            fi
          done
      # Fail on a changed producer or its consumer before building unrelated modules.
      # Lake reuses these outputs in the mandatory full build and NonVacuity gate below.
      - name: Check changed Lean modules and paired consumers
        if: github.event_name == 'pull_request' && steps.scope.outputs.docs_only != 'true'
        env:
          LEAN_NUM_THREADS: 4
          SCOPED_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          targets=()
          while IFS= read -r -d '' path; do
            case "$path" in
              OddMath/*.lean)
                module="${path%.lean}"
                targets+=("+${module//\//.}")
                consumer="scripts/NonVacuity/${path##*/}"
                if [ -f "$consumer" ]; then
                  module="${consumer#scripts/}"
                  module="${module%.lean}"
                  targets+=("+${module//\//.}")
                fi
                ;;
              scripts/NonVacuity/*.lean)
                module="${path#scripts/}"
                module="${module%.lean}"
                targets+=("+${module//\//.}")
                ;;
            esac
          done < <(git diff --diff-filter=AM --name-only -z "$SCOPED_BASE" HEAD -- OddMath scripts/NonVacuity)
          if [ "${#targets[@]}" -gt 0 ]; then
            mapfile -t targets < <(printf '%s\n' "${targets[@]}" | sort -u)
            set -o pipefail
            lake build --wfail "${targets[@]}" < /dev/null 2>&1 | awk "$FAIL_FAST"
          fi
      # The largest modules need up to about 6 GB and the runner has 16 GB: two concurrent Lean
      # processes.
      - name: Build
        if: steps.scope.outputs.docs_only != 'true'
        env:
          LEAN_NUM_THREADS: 4
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            set -o pipefail
            lake build --wfail < /dev/null 2>&1 | awk "$FAIL_FAST"
          else
            lake build --wfail < /dev/null
          fi
      - name: Axiom audit
        if: steps.scope.outputs.docs_only != 'true'
        run: lake env lean -DwarningAsError=true scripts/AxiomAudit.lean
      # The checks form the library `NonVacuity` (see `lakefile.lean`), so their `.olean` files are
      # cached with the build and only checks whose imports changed are elaborated again.
      - name: Non-vacuity checks
        if: steps.scope.outputs.docs_only != 'true'
        env:
          LEAN_NUM_THREADS: 4
        run: lake build --wfail NonVacuity < /dev/null
      # Cache directory inputs are archived recursively; nested negative globs do not
      # reliably omit these files. All Lean processes have finished before this cleanup.
      - name: Remove regenerated Lean setup metadata
        if: always() && steps.scope.outputs.docs_only != 'true'
        run: |
          for build in .lake/build .lake/packages/{DG,StringDiagrams,LieLean,Categorification}/.lake/build; do
            if [ -d "$build/ir" ]; then
              find "$build/ir" -type f -name '*.setup.json' -delete
            fi
          done
      - name: Save Categorification cache
        if: always() && github.event_name != 'pull_request' && steps.scope.outputs.docs_only != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            .lake/packages/Categorification/.lake/build
          key: categorification-artifacts-v2-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Save build cache
        if: always() && steps.scope.outputs.docs_only != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            .lake/build
            .lake/packages/DG/.lake/build
            .lake/packages/StringDiagrams/.lake/build
            .lake/packages/LieLean/.lake/build
          key: lake-artifacts-v2-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-${{ github.run_id }}-${{ github.run_attempt }}

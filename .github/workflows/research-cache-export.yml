name: Export verified research build cache

on:
  pull_request:
    paths:
      - .github/workflows/research-cache-export.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Restore matching research proof artifacts
        uses: actions/cache/restore@v4
        with:
          path: |
            .lake/build
            .lake/packages/DG/.lake/build
            .lake/packages/StringDiagrams/.lake/build
            .lake/packages/LieLean/.lake/build
          key: lake-artifacts-v2-Linux-d791b020c21edcc7e9e22797f1d59fde59e8af8f675af62dc2f1fd7521bfef93-b0f80af4e2e6f0f64a0f57b21c1ff7af3b688e11194836b1dc046cfec422dca1-41665774188-1
          fail-on-cache-miss: true
      - name: Restore matching categorification artifacts
        uses: actions/cache/restore@v4
        with:
          path: .lake/packages/Categorification/.lake/build
          key: categorification-artifacts-v2-Linux-d791b020c21edcc7e9e22797f1d59fde59e8af8f675af62dc2f1fd7521bfef93-b0f80af4e2e6f0f64a0f57b21c1ff7af3b688e11194836b1dc046cfec422dca1-41665774188-1
          fail-on-cache-miss: true
      # Only compiled libraries from public source are exported. No logs,
      # setup metadata, environment files, native objects or source files.
      - name: Package compiled public proof libraries only
        run: |
          find .lake/build/lib/lean \
            .lake/packages/DG/.lake/build/lib/lean \
            .lake/packages/StringDiagrams/.lake/build/lib/lean \
            .lake/packages/LieLean/.lake/build/lib/lean \
            .lake/packages/Categorification/.lake/build/lib/lean \
            -type f \( -name '*.olean' -o -name '*.ilean' -o -name '*.olean.hash' -o -name '*.ilean.hash' \) \
            -print0 > /tmp/proof-libraries.list
          tar --null --files-from=/tmp/proof-libraries.list \
            --use-compress-program='zstd -T2 -3' -cf research-lean-cache.tar.zst
          sha256sum research-lean-cache.tar.zst > research-lean-cache.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: research-lean-cache
          path: |
            research-lean-cache.tar.zst
            research-lean-cache.sha256
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
